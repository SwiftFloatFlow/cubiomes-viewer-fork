name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'trunk'
    tags:
      - 'v*'

defaults:
  run:
    shell: cmd

env:
  PROG:         cubiomes-viewer
  SOURCE_DIR:   ${{github.workspace}}
  QTBASE_URL:   https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.zip
  QTPREFIX:     C:\Qt\static\5.15.2\mingw81_64


jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt (MinGW toolchain + lrelease)
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion:   '==3.1.*'
          version:      '5.15.2'
          host:         'windows'
          target:       'desktop'
          arch:         'win64_mingw81'
          archives:     'x86_64 qtbase qttools'
          cache:        true
          setup-python: false

      - name: Cache static Qt
        id: cache-qt-static
        uses: actions/cache@v4
        with:
          path: C:\Qt\static\5.15.2\mingw81_64
          key: qt-static-5.15.2-mingw81-v1

      - name: Build static Qt
        if: steps.cache-qt-static.outputs.cache-hit != 'true'
        working-directory: ${{runner.temp}}
        run:  |
              perl -v >nul 2>&1 || echo "WARNING: perl not found"
              curl -L --retry 3 -o qtbase.zip %QTBASE_URL%
              powershell -Command "Expand-Archive -Force qtbase.zip ."
              powershell -NoProfile -Command "$f='qtbase-everywhere-src-5.15.2\src\corelib\global\qglobal.h'; $c=Get-Content $f -Raw; if($c.Contains('include <limits>')) { Write-Output 'qglobal.h already patched' } else { $c=$c.Replace('#  include <type_traits>','#  include <type_traits>' + [char]13 + [char]10 + '#  include <limits>'); Set-Content $f $c -NoNewline; Write-Output 'patched qglobal.h: added #include <limits>' }"
              powershell -NoProfile -Command "$f='qtbase-everywhere-src-5.15.2\src\corelib\io\qfilesystemengine_win.cpp'; $c=Get-Content $f -Raw; if($c.Contains('_WIN32_WINNT < 0x0602')) { Write-Output 'qfilesystemengine_win.cpp already patched' } else { $c=$c.Replace('#if defined(Q_CC_MINGW) && WINVER < 0x0602 //  Windows 8 onwards','#if defined(Q_CC_MINGW) && WINVER < 0x0602 && _WIN32_WINNT < 0x0602 //  Windows 8 onwards'); Set-Content $f $c -NoNewline; Write-Output 'patched qfilesystemengine_win.cpp' }"
              cd qtbase-everywhere-src-5.15.2
              configure.bat -opensource -confirm-license -release -static -platform win32-g++ -prefix %QTPREFIX% -nomake examples -nomake tests -no-opengl -no-angle -no-icu -no-openssl -no-dbus -no-vulkan -no-egl -qt-zlib -qt-libpng -qt-libjpeg -qt-freetype -qt-pcre -qt-harfbuzz
              mingw32-make -j2
              mingw32-make install

      - name: Regenerate translations
        working-directory: ${{env.SOURCE_DIR}}
        run:  |
              lrelease rc\lang\en_US.ts rc\lang\de_DE.ts rc\lang\zh_CN.ts

      - name: Build
        working-directory: ${{env.SOURCE_DIR}}
        run:  |
              "%QTPREFIX%\bin\qmake.exe" CONFIG+=release %SOURCE_DIR%
              "%QTPREFIX%\bin\mingw32-make.exe"

      - name: Package
        working-directory: ${{env.SOURCE_DIR}}
        run:  |
              mkdir %PROG%
              copy release\%PROG%.exe %PROG%\
              echo --- DLL imports ---
              objdump -p %PROG%\%PROG%.exe | findstr /i "DLL Name"
              echo --- version ---
              %PROG%\%PROG%.exe --version

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROG}}-win
          path: ${{env.SOURCE_DIR}}\${{env.PROG}}
